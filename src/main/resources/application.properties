spring.application.name=minhaestante

# A API vai funcionar na porta 8080.
server.port=8080

# Banco H2 em memória: os dados são apagados quando a aplicação encerra.
spring.datasource.url=jdbc:h2:mem:estante
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria as tabelas ao iniciar e remove ao encerrar.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console do H2 para consultar o banco durante o desenvolvimento.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
